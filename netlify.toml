[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Send the second domain to the main one
[[redirects]]
  from = "https://gettothechopperbook.com/*"
  to = "https://choppedrecipes.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.gettothechopperbook.com/*"
  to = "https://choppedrecipes.com/:splat"
  status = 301
  force = true

